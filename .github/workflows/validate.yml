name: Validate production candidate

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env:
          POSTGRES_USER: ez_test
          POSTGRES_PASSWORD: local-ci-only-password
          POSTGRES_DB: ez_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ez_test -d ez_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ez_test:local-ci-only-password@127.0.0.1:5432/ez_integration_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified upstream tag
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified upstream tag
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Committed credential guard
        run: node scripts/check-committed-secrets.cjs
      - name: Frozen dependency installation
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Backend lint
        run: npm run lint --workspace=server
      - name: Frontend lint
        run: npm run lint --workspace=client
      - name: Build release candidate
        run: npm run build
      - name: Maintained backend unit regressions
        run: npm run test:unit --workspace=server
      - name: PostgreSQL 16 recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Local setup and secure operator bootstrap
        run: node scripts/local-setup-smoke.mjs
      - name: Real PostgreSQL and HTTP isolation regressions
        run: npm run test:integration --workspace=server
      - name: Real session and Socket.IO isolation
        run: node scripts/realtime-smoke.cjs
      - name: Concurrent chat and reaction database regressions
        run: npm run test:chat --workspace=server
      - name: Task hierarchy and nested authorization regressions
        run: npm run test:hierarchy --workspace=server
      - name: Frontend component tests
        run: npm run test --workspace=client -- --maxWorkers=2
      - name: Install pinned browser
        run: npm exec --workspace=client -- playwright install --with-deps chromium
      - name: Compiled production login and legacy Google links
        run: npm run test:built-ui --workspace=server
      - name: Browser journeys with real operator and tenant API
        run: npm run test:browser --workspace=server
      - name: Durable jobs and encrypted backup/restore rehearsal
        run: npm run test:operations --workspace=server
      - name: Dependency security gate
        run: npm audit --audit-level=moderate
      - name: Retain tested artifact and browser diagnostics
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, verified upstream tag
        with:
          name: validated-${{ github.sha }}
          path: |
            server/dist
            client/dist
            package-lock.json
          retention-days: 7
          if-no-files-found: error

# This workflow validates only. It has no deployment credential, production
# environment, workflow_dispatch or Railway CLI step. A release must use the
# exact reviewed commit/artifact and a separate authorized deployment process.
