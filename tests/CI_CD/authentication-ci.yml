name: Authentication Tests CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/src/auth/**'
      - 'server/src/middlewares/**'
      - 'server/src/config/**'
      - 'tests/feature/authentication.test.ts'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/src/auth/**'
      - 'server/src/middlewares/**'
      - 'server/src/config/**'
      - 'tests/feature/authentication.test.ts'

jobs:
  test-authentication:
    name: Test Authentication & Authorization
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: servicebay_pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          SESSION_SECRET=test-secret-key-minimum-32-characters-long
          GOOGLE_CLIENT_ID=test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=test-client-secret
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
          ADMIN_EMAILS=admin@servicebay.ai,test.admin@servicebay.ai
          CORS_ORIGIN=http://localhost:5173
          CLIENT_URL=http://localhost:5173
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=100
          MAX_FILE_SIZE=5242880
          UPLOAD_DIR=uploads
          SESSION_MAX_AGE=604800000
          EOF

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
        run: |
          cd server
          npx prisma migrate deploy
          npx prisma generate

      - name: Run authentication tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          NODE_ENV: test
        run: |
          cd server
          npm run test tests/feature/authentication.test.ts -- --coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: authentication
          name: authentication-coverage

      - name: Check TypeScript compilation
        run: |
          cd server && npm run typecheck

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server && npm ci

      - name: Run npm audit
        run: |
          cd server && npm audit --audit-level=moderate

      - name: Check for security vulnerabilities
        run: |
          cd server && npx snyk test --severity-threshold=high || true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server && npm ci

      - name: Run ESLint
        run: |
          cd server && npm run lint

      - name: Check formatting
        run: |
          cd server && npm run format -- --check
