name: Summary View CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/src/components/summary/**'
      - 'client/src/hooks/useStatistics.ts'
      - 'server/src/tasks/statistics.ts'
      - 'tests/feature/summary-view.test.ts'
      - '.github/workflows/summary-view-ci.yml'
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Backend Statistics Tests
  backend-statistics-tests:
    name: Backend Statistics Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: servicebay_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Setup test database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run statistics endpoint tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
          NODE_ENV: test
        run: npm test -- statistics

  # Job 2: Frontend Component Tests
  frontend-component-tests:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run summary view component tests
        run: npm test -- summary-view.test.ts --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./client/coverage/coverage-final.json
          flags: summary-view
          name: summary-view-coverage

  # Job 3: Chart Rendering Tests
  chart-rendering-tests:
    name: Chart Rendering Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test individual chart components
        run: |
          npm test -- src/components/summary/TasksBySprintChart
          npm test -- src/components/summary/TasksByUserChart
          npm test -- src/components/summary/ProgressChart
          npm test -- src/components/summary/CompletionTrendChart

  # Job 4: Data Aggregation Tests
  data-aggregation-tests:
    name: Data Aggregation Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: servicebay_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Setup test database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Seed test data
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
        run: npx prisma db seed

      - name: Test data aggregation logic
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
          NODE_ENV: test
        run: npm test -- statistics.test

  # Job 5: Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: servicebay_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Setup database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Test statistics endpoint performance
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
          NODE_ENV: test
        run: |
          echo "Testing statistics endpoint response time..."
          npm run dev &
          SERVER_PID=$!
          sleep 5
          # Should respond in under 2 seconds
          time curl http://localhost:3000/api/tasks/statistics/summary
          kill $SERVER_PID

  # Job 6: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: servicebay_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: |
          npm install
          cd server && npm ci
          cd ../client && npm ci

      - name: Setup database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx prisma db seed

      - name: Start backend server
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
          NODE_ENV: test
          PORT: 3000
          SESSION_SECRET: test-secret
        run: |
          npm run dev &
          echo $! > server.pid
          sleep 10

      - name: Run frontend integration tests
        working-directory: ./client
        env:
          VITE_API_URL: http://localhost:3000
        run: npm test -- integration/summary

      - name: Stop server
        if: always()
        working-directory: ./server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

  # Job 7: Accessibility Tests
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: |
          echo "Testing chart accessibility..."
          npm test -- summary-view.test.ts

  # Job 8: Type Check
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check backend types
        working-directory: ./server
        run: |
          npm ci
          npx tsc --noEmit

      - name: Check frontend types
        working-directory: ./client
        run: |
          npm ci
          npm run typecheck

  # Job 9: Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Lint backend code
        working-directory: ./server
        run: |
          npm ci
          npm run lint

      - name: Lint frontend code
        working-directory: ./client
        run: |
          npm ci
          npm run lint

  # Job 10: Visual Regression Tests
  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        run: |
          echo "Visual regression tests for charts..."
          # Could use tools like Percy, Chromatic, etc.

  # Summary Job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - backend-statistics-tests
      - frontend-component-tests
      - chart-rendering-tests
      - data-aggregation-tests
      - performance-tests
      - integration-tests
      - accessibility-tests
      - type-check
      - code-quality
      - visual-regression-tests

    steps:
      - name: All tests passed
        run: echo "All summary view CI checks passed successfully!"
