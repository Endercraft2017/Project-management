name: Gantt View CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/src/components/gantt/**'
      - 'client/src/styles/gantt.css'
      - 'tests/feature/gantt-view.test.ts'
  pull_request:
    branches: [main, develop]

jobs:
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Gantt view tests
        run: npm test -- gantt-view.test.ts --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./client/coverage/coverage-final.json
          flags: gantt-view

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: servicebay_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: Setup database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx prisma db seed

      - name: Start server
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/servicebay_test
          NODE_ENV: test
          PORT: 3000
          SESSION_SECRET: test-secret
        run: |
          npm run dev &
          echo $! > server.pid
          sleep 10

      - name: Run integration tests
        working-directory: ./client
        env:
          VITE_API_URL: http://localhost:3000
        run: npm test -- integration/gantt

      - name: Stop server
        if: always()
        working-directory: ./server
        run: kill $(cat server.pid) || true

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [component-tests, integration-tests, type-check, lint]

    steps:
      - name: All tests passed
        run: echo "All Gantt view CI checks passed!"
