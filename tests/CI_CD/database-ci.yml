name: Database Tests CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/database/**'
      - 'server/src/database/**'
      - 'tests/feature/database.test.ts'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/database/**'
      - 'server/src/database/**'
      - 'tests/feature/database.test.ts'

jobs:
  test-database:
    name: Test Database Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: servicebay_pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Setup test environment
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.test
          cd server && npx prisma migrate deploy
          cd server && npx prisma generate

      - name: Run database tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          NODE_ENV: test
        run: |
          cd server && npm run test tests/feature/database.test.ts

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: database
          name: database-coverage

      - name: Check migration status
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
        run: |
          cd server && npx prisma migrate status

  lint-schema:
    name: Lint Prisma Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prisma
        run: npm install -g prisma

      - name: Validate Prisma schema
        run: |
          cd server && npx prisma validate

      - name: Format check
        run: |
          cd server && npx prisma format --check
