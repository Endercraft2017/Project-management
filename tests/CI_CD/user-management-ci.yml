name: User Management Tests CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/src/users/**'
      - 'server/src/auth/middleware.ts'
      - 'server/src/app.ts'
      - 'tests/feature/user-management.test.ts'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/src/users/**'
      - 'server/src/auth/middleware.ts'
      - 'server/src/app.ts'
      - 'tests/feature/user-management.test.ts'

jobs:
  test-user-management:
    name: Test User Management API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: servicebay_pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          SESSION_SECRET=test-secret-key-minimum-32-characters-long
          GOOGLE_CLIENT_ID=test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=test-client-secret
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
          ADMIN_EMAILS=admin@servicebay.ai,test.admin@servicebay.ai
          CORS_ORIGIN=http://localhost:5173
          CLIENT_URL=http://localhost:5173
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=100
          MAX_FILE_SIZE=5242880
          UPLOAD_DIR=uploads
          SESSION_MAX_AGE=604800000
          EOF

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
        run: |
          cd server
          npx prisma migrate deploy
          npx prisma generate

      - name: Run user management tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          NODE_ENV: test
        run: |
          cd server
          npm run test tests/feature/user-management.test.ts -- --coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: user-management
          name: user-management-coverage

      - name: Check TypeScript compilation
        run: |
          cd server && npm run typecheck

  integration-test:
    name: Integration Tests (Auth + Users)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: servicebay_pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-interval 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          SESSION_SECRET=test-secret-key-minimum-32-characters-long
          GOOGLE_CLIENT_ID=test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=test-client-secret
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
          ADMIN_EMAILS=admin@servicebay.ai,test.admin@servicebay.ai
          CORS_ORIGIN=http://localhost:5173
          CLIENT_URL=http://localhost:5173
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=100
          MAX_FILE_SIZE=5242880
          UPLOAD_DIR=uploads
          SESSION_MAX_AGE=604800000
          EOF

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
        run: |
          cd server
          npx prisma migrate deploy
          npx prisma generate
          npx prisma db seed

      - name: Run all feature tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          NODE_ENV: test
        run: |
          cd server
          npm run test tests/feature/ -- --coverage

      - name: Upload integration coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: integration
          name: integration-coverage

  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server && npm ci

      - name: Validate input sanitization
        run: |
          cd server
          # Check for XSS prevention in validators
          grep -r "z.string().*trim()" src/users/validators.ts || exit 0

      - name: Check RBAC implementation
        run: |
          cd server
          # Verify middleware usage in routes
          grep -c "isAdmin\|isAdminOrOwner" src/users/routes.ts

      - name: Verify audit logging
        run: |
          cd server
          # Check for audit logs in sensitive operations
          grep -c "console.log.*Role changed\|User deactivated\|User activated" src/users/controller.ts

  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server && npm ci

      - name: Run ESLint
        run: |
          cd server && npm run lint

      - name: Check formatting
        run: |
          cd server && npm run format -- --check

      - name: Check for TODO/FIXME comments
        run: |
          cd server
          ! grep -rn "TODO\|FIXME" src/users/ || echo "Found TODO/FIXME comments in user management code"
