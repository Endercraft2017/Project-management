          NODE_ENV=test
          DATABASE_URL=postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
          SESSION_SECRET=test-secret-key-minimum-32-characters-long
          GOOGLE_CLIENT_ID=test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=test-client-secret
          ADMIN_EMAILS=admin@servicebay.ai
          GOOGLE_SHEETS_ENABLED=false
          EOF

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/servicebay_pm_test
        run: |
          cd server
          npx prisma migrate deploy
          npx prisma generate

      - name: Test lastWriterWins strategy
        run: |
          cd server
          npm run test -- --testNamePattern="lastWriterWins" || echo "lastWriterWins tests to be implemented"

      - name: Test skipConflicts strategy
        run: |
          cd server
          npm run test -- --testNamePattern="skipConflicts" || echo "skipConflicts tests to be implemented"

      - name: Test overwriteAll strategy
        run: |
          cd server
          npm run test -- --testNamePattern="overwriteAll" || echo "overwriteAll tests to be implemented"

  performance-test:
    name: Performance and Scalability Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
