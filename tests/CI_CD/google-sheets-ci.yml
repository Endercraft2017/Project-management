          npx prisma generate

      - name: Test large dataset export
        run: |
          cd server
          npm run test -- --testNamePattern="large.*export" || echo "Large dataset export tests to be implemented"

      - name: Test large dataset import
        run: |
          cd server
          npm run test -- --testNamePattern="large.*import" || echo "Large dataset import tests to be implemented"

      - name: Test bidirectional sync performance
        run: |
          cd server
          npm run test -- --testNamePattern="bidirectional.*performance" || echo "Bidirectional performance tests to be implemented"

      - name: Verify batch processing
        run: |
          cd server
          # Check for batch operations in service
          grep -q "batch\|Promise.all" src/sync/service.ts || echo "Batch processing check"

  data-integrity-tests:
